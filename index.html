<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحة: إرسال بعد موافقة المستخدم</title>
  <style>
    body { font-family: system-ui, Arial; padding: 20px; max-width: 820px; margin: auto; direction: rtl; }
    label { display:block; margin-top:12px; }
    input[type="email"], input[type="password"], input[type="text"], input[type="url"], input[type="file"] {
      width:100%; padding:8px; margin-top:6px; box-sizing:border-box;
    }
    .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    button { padding:8px 12px; cursor:pointer; }
    .hint { color:#666; font-size:0.95rem; margin-top:6px; }
    .consent-note { margin-top:8px; background:#fff8dc; padding:8px; border-radius:6px; }
    .toast { position:fixed; bottom:18px; left:18px; background:#222; color:#fff; padding:10px 14px; border-radius:8px; display:none; }
  </style>
</head>
<body>
  <h1>نموذج إرسال بعد موافقة المستخدم</h1>
  <p class="hint">لن تُرسل أي بيانات إلا بعد الموافقة الصريحة.</p>

  <form id="demoForm" onsubmit="event.preventDefault();">
    <label>البريد الإلكتروني
      <input id="email" type="email" placeholder="user@example.com" required />
    </label>

    <label>كلمة المرور
      <input id="password" type="password" placeholder="أدخل كلمة المرور" required minlength="4" />
    </label>

    <label>اختر ملفات للمشاركة (اختياري)
      <input id="fileInput" type="file" multiple />
    </label>

    <div class="row">
      <button id="copyBtn" type="button" disabled>نسخ البريد وكلمة السر</button>
      <button id="copyAllBtn" type="button" disabled>نسخ كل بيانات المستخدم</button>
      <button id="uploadBtn" type="button" disabled>رفع الملفات مع الموافقة</button>
      <button id="sendBtn" type="button" disabled>إرسال إلى السيرفر</button>
    </div>

    <label style="margin-top:12px;">
      <input id="hashCheckbox" type="checkbox" /> تحويل كلمة المرور إلى SHA-256 على المتصفح
    </label>

    <label style="margin-top:8px;">
      <input id="consentCheckbox" type="checkbox" /> أوافق صراحةً على نسخ/إرسال بياناتي وتخزين ملفاتي
    </label>

    <div class="consent-note small" id="consentNote" style="display:none">
      قمت بالموافقة في: <span id="consentTime"></span>
    </div>

    <label style="margin-top:8px;">
      عنوان السيرفر (للاختبار):
      <input id="serverUrl" type="url" placeholder="http://localhost:3000/receive" />
    </label>

    <div id="result" class="hint"></div>
  </form>

  <div id="toast" class="toast"></div>

<script>
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const consentEl = document.getElementById('consentCheckbox');
  const copyBtn = document.getElementById('copyBtn');
  const copyAllBtn = document.getElementById('copyAllBtn');
  const sendBtn = document.getElementById('sendBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const hashCheckbox = document.getElementById('hashCheckbox');
  const serverUrlEl = document.getElementById('serverUrl');
  const result = document.getElementById('result');
  const fileInput = document.getElementById('fileInput');
  const consentNote = document.getElementById('consentNote');
  const consentTimeSpan = document.getElementById('consentTime');
  const toast = document.getElementById('toast');

  let consentTimestamp = null;

  function showToast(text, ms=4000) {
    toast.textContent = text;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> toast.style.display='none', ms);
  }

  function updateButtons() {
    const ok = consentEl.checked;
    copyBtn.disabled = !ok;
    copyAllBtn.disabled = !ok;
    uploadBtn.disabled = !ok || fileInput.files.length===0;
    try {
      const u = new URL(serverUrlEl.value || '');
      sendBtn.disabled = !(ok && (u.protocol === 'https:' || u.protocol === 'http:'));
    } catch {
      sendBtn.disabled = true;
    }
  }

  consentEl.addEventListener('change', async () => {
    if (consentEl.checked) {
      consentTimestamp = new Date().toISOString();
      consentNote.style.display = 'block';
      consentTimeSpan.textContent = consentTimestamp;
      // طلب إذن عرض إشعار للمستخدم
      try {
        if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          if (perm === 'granted') {
            new Notification('تمت الموافقة', { body: 'تمت الموافقة وسيتم تخزين بياناتك وملفاتك حسب رغبتك.' });
          } else {
            showToast('تمت الموافقة ولكن متصفحك منع الإشعارات.');
          }
        }
        // محاولة نسخ تلقائي للبيانات الأساسية
        try {
          await copyAllData();
          result.textContent = 'تم نسخ كل البيانات إلى الحافظة إثر موافقتك.';
        } catch (e) {
          result.textContent = 'النسخ التلقائي محجوب — استخدم زر "نسخ كل بيانات المستخدم".';
        }
      } catch(e) {
        console.warn('Notification/consent handling failed', e);
      }
    } else {
      consentTimestamp = null;
      consentNote.style.display = 'none';
      consentTimeSpan.textContent = '';
      result.textContent = '';
    }
    updateButtons();
  });

  fileInput.addEventListener('change', updateButtons);
  serverUrlEl.addEventListener('input', updateButtons);

  async function sha256Hex(text) {
    const enc = new TextEncoder();
    const digest = await crypto.subtle.digest('SHA-256', enc.encode(text));
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function buildAllDataText() {
    const email = emailEl.value.trim();
    const pass = passEl.value;
    const serverUrl = serverUrlEl.value.trim() || '(no server)';
    const hashed = hashCheckbox.checked;
    if (!email || !pass) throw new Error('أدخل البريد وكلمة المرور أولاً.');
    const passwordValue = hashed ? await sha256Hex(pass) : pass;

    const lines = [];
    lines.push(`email: ${email}`);
    lines.push(`password: ${passwordValue}`);
    lines.push(`password_hashed_on_client: ${hashed}`);
    lines.push(`consent: true`);
    lines.push(`consent_at: ${consentTimestamp || new Date().toISOString()}`);
    lines.push(`consent_text: User accepted data sending via demo UI`);
    lines.push(`server_url: ${serverUrl}`);
    lines.push(`copied_at: ${new Date().toISOString()}`);
    return lines.join('\n');
  }

  async function copyAllData() {
    const text = await buildAllDataText();
    await navigator.clipboard.writeText(text);
  }

  copyBtn.addEventListener('click', async () => {
    if (!consentEl.checked) { alert('لا يمكن النسخ بدون موافقة.'); return; }
    const email = emailEl.value.trim(); const pass = passEl.value;
    if (!email || !pass) { alert('أدخل البريد وكلمة المرور.'); return; }
    const toCopy = hashCheckbox.checked ? await sha256Hex(pass) : pass;
    try { await navigator.clipboard.writeText(`email: ${email}\npassword: ${toCopy}`); result.textContent = 'تم نسخ البريد وكلمة السر إلى الحافظة.'; }
    catch (e) { result.textContent = 'فشل النسخ: ' + e; }
  });

  copyAllBtn.addEventListener('click', async () => {
    try { await copyAllData(); result.textContent = 'تم نسخ كل البيانات إلى الحافظة.'; }
    catch (e) { result.textContent = 'فشل النسخ: ' + e; }
  });

  sendBtn.addEventListener('click', async () => {
    if (!consentEl.checked) { alert('لا يمكن الإرسال بدون موافقة.'); return; }
    const url = serverUrlEl.value.trim(); if (!url) { alert('أدخل عنوان السيرفر.'); return; }
    const email = emailEl.value.trim(); const pass = passEl.value;
    if (!email || !pass) { alert('أدخل البريد وكلمة المرور.'); return; }
    const passwordValue = hashCheckbox.checked ? await sha256Hex(pass) : pass;

    const payload = { email, password: passwordValue, consent: true, consent_at: consentTimestamp, consent_text: 'User accepted data sending via demo UI', hashed: hashCheckbox.checked };
    try {
      const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
      const text = await res.text();
      result.textContent = 'استجابة السيرفر: ' + res.status + ' — ' + text;
    } catch (e) {
      result.textContent = 'خطأ في الإرسال: ' + e;
    }
  });

  uploadBtn.addEventListener('click', async () => {
    if (!consentEl.checked) { alert('لا يمكن الرفع بدون موافقة.'); return; }
    const urlBase = serverUrlEl.value.trim();
    if (!urlBase) { alert('أدخل عنوان السيرفر.'); return; }
    // نفترض endpoint الرفع: <base-origin>/upload
    let uploadUrl;
    try {
      const u = new URL(serverUrlEl.value.trim());
      uploadUrl = u.origin + '/upload';
    } catch {
      alert('عنوان السيرفر غير صالح'); return;
    }
    const files = fileInput.files;
    if (!files || files.length===0) { alert('اختر ملفات أولاً'); return; }

    const form = new FormData();
    for (const f of files) form.append('files', f);
    form.append('email', emailEl.value.trim());
    form.append('consent', 'true');
    form.append('consent_at', consentTimestamp || new Date().toISOString());

    try {
      const res = await fetch(uploadUrl, { method:'POST', body: form });
      const json = await res.json();
      if (res.ok) {
        showToast('تم رفع ' + (json.saved || json.filesCount || files.length) + ' ملف(ملفات).');
        result.textContent = 'Upload OK: ' + JSON.stringify(json);
      } else {
        result.textContent = 'Upload failed: ' + (json.error || JSON.stringify(json));
      }
    } catch (e) {
      result.textContent = 'خطأ بالرفع: ' + e;
    }
  });

  updateButtons();
</script>
</body>
</html>
